name: memoir_v1
description: "memoir. Mobile Runner — Kiosk photobooth app for Android tablets."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7

  # Routing
  go_router: ^15.1.2

  # Networking
  dio: ^5.8.0+1

  # Local Storage
  hive_ce: ^2.7.0
  hive_ce_flutter: ^2.3.4
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4

  # Hardware
  camera: ^0.11.1

  # UI
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  qr_flutter: ^4.1.0

  # Image processing
  image: ^4.5.3

  # Dependency Injection
  get_it: ^8.0.3
  permission_handler: ^12.0.1
  print_bluetooth_thermal: ^1.1.9
  esc_pos_utils_plus: ^2.0.4
  path_provider: ^2.1.5
  image_picker: ^1.1.2
  path: ^1.9.1
  video_player: ^2.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "AppIcons/appstore.png"
  min_sdk_android: 21
  adaptive_icon_foreground: "AppIcons/appstore.png"
  adaptive_icon_background: "#FFFFFF"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
